name: Build APK

on:
  push:
    branches: [main, master, developer]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar la carpeta android (si no existe)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name catalogo_express --org co.edu.poligran .
            sed -i 's/android:label="[^"]*"/android:label="Catálogo Express"/' android/app/src/main/AndroidManifest.xml
            cp -r branding/android_icons/* android/app/src/main/res/
          fi

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renombrar el APK
        run: cp build/app/outputs/flutter-apk/app-release.apk CatalogoExpress.apk

      - name: Publicar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: CatalogoExpress-apk
          path: CatalogoExpress.apk
